<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Buzzer — 5 Groups</title>
<script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    user-select: none;
  }
  h1 { margin: 10px 0; font-size: 2em; text-align: center; }
  .conn {
    position: fixed; top: 10px; right: 15px;
    font-size: 0.85em; padding: 6px 12px;
    border-radius: 20px; background: rgba(0,0,0,0.4);
  }
  .conn.ok { color: #4CAF50; }
  .conn.bad { color: #f44336; }

  /* Role picker */
  .picker { max-width: 500px; margin: 40px auto; text-align: center; }
  .picker h2 { font-size: 1.5em; margin-bottom: 20px; }
  .picker .room-info {
    background: rgba(255,255,255,0.1); padding: 20px; border-radius: 12px;
    margin-bottom: 25px; word-break: break-all;
  }
  .picker .room-code { font-size: 2em; font-weight: bold; color: #ffd700; letter-spacing: 4px; }
  .picker .join-url { font-size: 0.9em; margin-top: 10px; opacity: 0.85; }
  .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
  .role-btn {
    padding: 20px; font-size: 1.1em; border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08); color: #fff; border-radius: 10px;
    cursor: pointer; font-weight: bold;
  }
  .role-btn:hover { background: rgba(255,255,255,0.18); transform: translateY(-2px); }
  .role-btn.host { grid-column: 1 / -1; background: rgba(255, 215, 0, 0.2); border-color: #ffd700; }

  /* Shared status banner */
  .status {
    font-size: 1.4em; min-height: 2em; margin: 10px 0 20px;
    text-align: center; padding: 12px 25px; border-radius: 10px;
    background: rgba(255,255,255,0.08); min-width: 320px;
  }
  .status.winner {
    background: #ffd700; color: #1a1a2e; font-weight: bold;
    animation: flash 0.5s ease infinite alternate;
    font-size: 1.8em;
  }
  @keyframes flash {
    from { box-shadow: 0 0 20px #ffd700; }
    to { box-shadow: 0 0 60px #ffeb3b, 0 0 100px #ffd700; }
  }

  /* Host view */
  .groups {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
    width: 100%; max-width: 1200px; margin-bottom: 20px;
  }
  .group {
    padding: 20px 10px; border-radius: 15px; text-align: center;
    transition: all 0.15s ease; border: 3px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
  }
  .group.winner {
    background: #ffd700; color: #1a1a2e; border-color: #fff;
    transform: scale(1.08); box-shadow: 0 0 40px #ffd700;
    animation: bounce 0.4s ease;
  }
  @keyframes bounce {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1.08); }
  }
  .group-name { font-size: 1.3em; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
  .score { font-size: 2.3em; font-weight: bold; }

  /* Group (player) view */
  .player {
    width: 100%; max-width: 500px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  .player .my-name { font-size: 2em; font-weight: bold; }
  .buzz-btn {
    width: 260px; height: 260px; border-radius: 50%;
    font-size: 2em; font-weight: bold; border: none;
    background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
    color: #fff; cursor: pointer; box-shadow: 0 10px 40px rgba(231,76,60,0.6);
    transition: all 0.1s ease;
  }
  .buzz-btn:hover:not(:disabled) { transform: scale(1.05); }
  .buzz-btn:active:not(:disabled) { transform: scale(0.95); box-shadow: 0 5px 20px rgba(231,76,60,0.6); }
  .buzz-btn:disabled { opacity: 0.4; cursor: not-allowed; background: #555; box-shadow: none; }
  .buzz-btn.won {
    background: radial-gradient(circle at 30% 30%, #ffeb3b, #f39c12);
    color: #1a1a2e; animation: flash 0.5s ease infinite alternate;
  }

  /* Fullscreen winner overlay */
  .overlay {
    position: fixed; inset: 0; background: rgba(255, 215, 0, 0.95);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; color: #1a1a2e; z-index: 100;
    animation: flash 0.5s ease infinite alternate;
  }
  .overlay.show { display: flex; }
  .overlay .big-name { font-size: 6em; font-weight: bold; text-align: center; padding: 20px; }
  .overlay .big-sub { font-size: 2em; font-weight: bold; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  button.ctrl {
    padding: 12px 24px; font-size: 1em; border: none; border-radius: 8px;
    cursor: pointer; font-weight: bold; transition: all 0.15s ease;
  }
  .btn-reset { background: #4CAF50; color: #fff; }
  .btn-award { background: #2196F3; color: #fff; }
  .btn-deduct { background: #ff9800; color: #fff; }
  .btn-clear { background: #f44336; color: #fff; }
  button.ctrl:hover { transform: translateY(-2px); filter: brightness(1.1); }
  button.ctrl:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .hint { margin-top: 15px; font-size: 0.85em; opacity: 0.7; text-align: center; }
  .back { background: none; color: #aaa; border: 1px solid #555; margin-top: 20px; }
</style>
</head>
<body>

<div class="conn" id="conn">connecting…</div>

<!-- Role picker (shown first) -->
<div id="pickerView" class="picker">
  <h1>Classroom Buzzer</h1>
  <div class="room-info">
    <div>Room code</div>
    <div class="room-code" id="roomCode">----</div>
    <div class="join-url">Groups join at:<br><strong id="joinUrl"></strong></div>
  </div>
  <h2>I am…</h2>
  <div class="role-grid">
    <button class="role-btn host" onclick="chooseRole('host')">🖥️ Host / Projector (shows all groups)</button>
    <button class="role-btn" onclick="chooseRole(1)">Group 1</button>
    <button class="role-btn" onclick="chooseRole(2)">Group 2</button>
    <button class="role-btn" onclick="chooseRole(3)">Group 3</button>
    <button class="role-btn" onclick="chooseRole(4)">Group 4</button>
    <button class="role-btn" onclick="chooseRole(5)">Group 5</button>
  </div>
</div>

<!-- Host view -->
<div id="hostView" style="display:none; width: 100%; align-items: center; flex-direction: column;">
  <h1>Classroom Buzzer — Room <span id="hostRoomCode"></span></h1>
  <div class="status" id="hostStatus">Waiting for a group to buzz in…</div>
  <div class="groups" id="hostGroups"></div>
  <div class="controls">
    <button class="ctrl btn-reset" onclick="sendReset()">Reset Buzzer (Space)</button>
    <button class="ctrl btn-award" onclick="sendScore(1)" id="awardBtn" disabled>+1 to Winner</button>
    <button class="ctrl btn-deduct" onclick="sendScore(-1)" id="deductBtn" disabled>−1 from Winner</button>
    <button class="ctrl btn-clear" onclick="sendClear()">Clear All Scores</button>
  </div>
  <div class="hint">Groups join at <strong id="hostJoinUrl"></strong><br>Space = reset · Click a name to rename</div>
  <button class="ctrl back" onclick="backToPicker()">← Change role</button>
</div>

<!-- Group player view -->
<div id="playerView" style="display:none;" class="player">
  <div class="my-name" id="myName"></div>
  <div class="status" id="playerStatus">Press BUZZ when you know the answer!</div>
  <button class="buzz-btn" id="buzzBtn" onclick="sendBuzz()">BUZZ!</button>
  <div class="hint">First group to press wins the round</div>
  <button class="ctrl back" onclick="backToPicker()">← Change role</button>
</div>

<!-- Fullscreen winner overlay (shown on all devices) -->
<div id="overlay" class="overlay">
  <div class="big-name" id="overlayName"></div>
  <div class="big-sub">buzzed in first!</div>
</div>

<script>
  // -------- Room code & URL --------
  function getParam(k) { return new URLSearchParams(location.search).get(k); }
  function randomRoom() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let r = '';
    for (let i = 0; i < 4; i++) r += chars[Math.floor(Math.random() * chars.length)];
    return r;
  }
  let room = (getParam('room') || '').toUpperCase();
  if (!room) {
    room = randomRoom();
    const url = new URL(location.href);
    url.searchParams.set('room', room);
    history.replaceState(null, '', url);
  }
  const joinUrl = location.href;
  document.getElementById('roomCode').textContent = room;
  document.getElementById('hostRoomCode').textContent = room;
  document.getElementById('joinUrl').textContent = joinUrl;
  document.getElementById('hostJoinUrl').textContent = joinUrl;

  // -------- State --------
  const groups = [
    { name: 'Group 1', score: 0 },
    { name: 'Group 2', score: 0 },
    { name: 'Group 3', score: 0 },
    { name: 'Group 4', score: 0 },
    { name: 'Group 5', score: 0 },
  ];
  let winner = null;    // 0-4 index or null
  let locked = false;
  let myRole = null;    // 'host' or 1-5

  // -------- MQTT connection --------
  const topic = `classroom-buzzer-utt/${room}`;
  const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
    clientId: 'buzzer-' + Math.random().toString(36).substr(2, 9),
    reconnectPeriod: 2000,
  });
  const connEl = document.getElementById('conn');
  client.on('connect', () => {
    connEl.textContent = '● connected';
    connEl.className = 'conn ok';
    client.subscribe(topic);
    // ask for current state from anyone online
    publish({ t: 'hello' });
  });
  client.on('reconnect', () => { connEl.textContent = 'reconnecting…'; connEl.className = 'conn bad'; });
  client.on('offline', () => { connEl.textContent = '○ offline'; connEl.className = 'conn bad'; });
  client.on('error', (e) => { console.error(e); });
  client.on('message', (_, raw) => {
    try { handleMsg(JSON.parse(raw.toString())); } catch(e) {}
  });

  function publish(obj) {
    if (client.connected) client.publish(topic, JSON.stringify(obj));
  }

  function handleMsg(m) {
    switch (m.t) {
      case 'buzz':
        if (!locked) { winner = m.g; locked = true; beep(900, 300); }
        render();
        break;
      case 'reset':
        winner = null; locked = false; render();
        break;
      case 'score':
        groups[m.g].score += m.d;
        render();
        break;
      case 'clear':
        groups.forEach(g => g.score = 0);
        winner = null; locked = false; render();
        break;
      case 'rename':
        groups[m.g].name = m.n;
        render();
        break;
      case 'hello':
        // Host broadcasts current state so new joiners catch up
        if (myRole === 'host') {
          publish({ t: 'state', groups, winner, locked });
        }
        break;
      case 'state':
        // Only accept state if we don't already have activity locally
        if (!locked && winner === null && groups.every(g => g.score === 0)) {
          m.groups.forEach((g, i) => { groups[i].name = g.name; groups[i].score = g.score; });
          winner = m.winner; locked = m.locked;
          render();
        }
        break;
    }
  }

  // -------- Message senders --------
  function sendBuzz() {
    if (locked || myRole === 'host' || myRole === null) return;
    const idx = myRole - 1;
    // Optimistic local update, then publish
    publish({ t: 'buzz', g: idx });
    if (!locked) { winner = idx; locked = true; beep(900, 300); render(); }
  }
  function sendReset() { publish({ t: 'reset' }); winner = null; locked = false; render(); }
  function sendScore(d) {
    if (winner === null) return;
    publish({ t: 'score', g: winner, d });
    groups[winner].score += d; render();
  }
  function sendClear() {
    if (!confirm('Clear all scores?')) return;
    publish({ t: 'clear' });
    groups.forEach(g => g.score = 0); winner = null; locked = false; render();
  }
  function sendRename(i, name) {
    publish({ t: 'rename', g: i, n: name });
    groups[i].name = name; render();
  }

  // -------- Role selection & views --------
  function chooseRole(r) {
    myRole = r;
    document.getElementById('pickerView').style.display = 'none';
    if (r === 'host') {
      document.getElementById('hostView').style.display = 'flex';
      document.addEventListener('keydown', hostKeys);
    } else {
      document.getElementById('playerView').style.display = 'flex';
      document.getElementById('myName').textContent = groups[r - 1].name;
    }
    render();
  }
  function backToPicker() {
    document.getElementById('hostView').style.display = 'none';
    document.getElementById('playerView').style.display = 'none';
    document.getElementById('pickerView').style.display = 'block';
    document.removeEventListener('keydown', hostKeys);
    myRole = null;
  }
  function hostKeys(e) {
    if (e.key === ' ') { e.preventDefault(); sendReset(); }
  }

  // -------- Render --------
  function render() {
    const overlay = document.getElementById('overlay');
    if (winner !== null) {
      document.getElementById('overlayName').textContent = groups[winner].name;
      overlay.classList.add('show');
      setTimeout(() => overlay.classList.remove('show'), 2500);
    } else {
      overlay.classList.remove('show');
    }

    if (myRole === 'host') renderHost();
    else if (typeof myRole === 'number') renderPlayer();
  }

  function renderHost() {
    const container = document.getElementById('hostGroups');
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#f39c12'];
    container.innerHTML = '';
    groups.forEach((g, i) => {
      const div = document.createElement('div');
      div.className = 'group' + (winner === i ? ' winner' : '');
      div.style.borderColor = colors[i];
      div.innerHTML = `
        <div class="group-name" onclick="renameGroupPrompt(${i})">${g.name}</div>
        <div class="score">${g.score}</div>
      `;
      container.appendChild(div);
    });
    const status = document.getElementById('hostStatus');
    if (winner !== null) {
      status.textContent = `🏆 ${groups[winner].name} buzzed in first!`;
      status.classList.add('winner');
    } else {
      status.textContent = 'Waiting for a group to buzz in…';
      status.classList.remove('winner');
    }
    document.getElementById('awardBtn').disabled = winner === null;
    document.getElementById('deductBtn').disabled = winner === null;
  }

  function renderPlayer() {
    const idx = myRole - 1;
    document.getElementById('myName').textContent = groups[idx].name;
    const btn = document.getElementById('buzzBtn');
    const status = document.getElementById('playerStatus');

    if (winner === idx) {
      btn.disabled = true;
      btn.classList.add('won');
      btn.textContent = '🏆 YOU WON!';
      status.textContent = 'You buzzed in first!';
      status.classList.add('winner');
    } else if (locked) {
      btn.disabled = true;
      btn.classList.remove('won');
      btn.textContent = 'LOCKED';
      status.textContent = `${groups[winner].name} buzzed in first`;
      status.classList.remove('winner');
    } else {
      btn.disabled = false;
      btn.classList.remove('won');
      btn.textContent = 'BUZZ!';
      status.textContent = 'Press BUZZ when you know the answer!';
      status.classList.remove('winner');
    }
  }

  function renameGroupPrompt(i) {
    const name = prompt('Rename group:', groups[i].name);
    if (name && name.trim()) sendRename(i, name.trim());
  }

  // -------- Beep --------
  function beep(freq = 800, duration = 200) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + duration / 1000);
    } catch(e) {}
  }
</script>
</body>
</html>
